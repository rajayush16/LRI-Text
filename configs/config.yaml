# Global project configuration — LRI-Text
# Low-Resource Indian Language Text Classification Using Multilingual Transformers

project:
  name: "LRI-Text"
  title: "A Data-Efficient Framework for Hindi and Bengali Sentiment Classification: Evaluating Multilingual Transformers under Low-Resource, Augmented, and Cross-Lingual Settings"
  seed_list: [42, 123]   # 2 seeds per experiment (reduced scope decision)

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  checkpoints: "checkpoints"
  results_metrics: "results/metrics"
  results_figures: "results/figures"
  results_logs: "results/logs"

languages:
  hindi:
    code: "hi"
    dataset_name: "ai4bharat/indic_glue"
    dataset_config: "iitp-mr.hi"   # IITP Movie Reviews, 3-class neg/neu/pos
    text_column: "text"
    label_column: "label"
    num_classes: 3
    # Verified via datasets ClassLabel schema: ClassLabel(names=['negative','neutral','positive'])
    raw_label_to_name: {0: "negative", 1: "neutral", 2: "positive"}
  bengali:
    code: "bn"
    dataset_name: "khondoker/SentNoB"
    dataset_config: null
    text_column: "Data"             # verified against actual parquet columns at audit time
    label_column: "Label"
    num_classes: 3
    # Verified via HF dataset card: "positive (1), negative (2), or neutral (0)" — OPPOSITE
    # ordering from Hindi IITP. Must be remapped to the canonical scheme below during
    # preprocessing; never assume raw ints are directly comparable across languages.
    raw_label_to_name: {0: "neutral", 1: "positive", 2: "negative"}

# Canonical label scheme both languages are remapped to during preprocessing
# (src/data/preprocessing.py), so downstream training/eval use consistent integer ids.
canonical_label_names: ["negative", "neutral", "positive"]
canonical_name_to_id: {"negative": 0, "neutral": 1, "positive": 2}

cross_lingual_eval:
  dataset_name: "ai4bharat/IndicSentiment"
  configs: ["translation-hi", "translation-bn"]   # actual available config names, verified at download time
  text_column: "INDIC REVIEW"
  label_column: "LABEL"
  # VERIFIED directly from the downloaded data (correcting an earlier, wrong secondhand
  # claim of a 3-class pos/neg/neutral scheme): this benchmark is STRICTLY BINARY
  # (Positive/Negative only, no Neutral), and the test split has some missing (None)
  # labels that must be dropped before evaluation.
  raw_label_to_canonical_name: {"Negative": "negative", "Positive": "positive"}
  note: >
    Dev+test only, no train split — evaluation-only parallel benchmark. Only 2 of the
    3 canonical classes are ever present; a 3-class-trained model's 'neutral'
    predictions are simply counted as wrong against this benchmark, which is reported
    explicitly as a scope limitation, not glossed over as a fair 3-way comparison.

data_budgets: [0.10, 0.50, 1.00]   # reduced from [0.10, 0.25, 0.50, 1.00]

few_shot:
  shots_per_class: [16, 32]        # reduced from [8, 16, 32, 64]

training:
  max_seq_length: 128
  batch_size: 8
  gradient_accumulation_steps: 2   # effective batch size 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 5
  early_stopping_patience: 2
  fp16: true
  optimizer: "adamw"
  eval_metric_for_best_model: "macro_f1"

augmentation:
  methods: ["back_translation"]    # contextual MLM substitution = stretch goal, not in core scope
  pivot_language: "en"
  max_augmented_ratio: 1.0         # at most double the original training set size
  apply_to: ["train_only"]         # never val/test

hardware:
  device_preference: "cuda"
  fallback: "cpu"
  notes: "Target GPU: NVIDIA RTX 3060 Laptop, 6GB VRAM. Use fp16 + grad accumulation to fit base-size models."
